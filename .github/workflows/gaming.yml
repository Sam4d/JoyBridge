name: Build PC gaming app
on:
  push:
    branches: [main]
    paths: ['gaming/**', '.github/workflows/gaming.yml', 'experiments/android-motion/bridge.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    env:
      VGAMEPAD_SKIP_VIGEMBUS_INSTALL: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.16.0 vgamepad==0.1.3 pillow==11.3.0
      - run: python scripts/fetch_sdl.py
      - run: python -m unittest discover -s gaming -v
      - name: Screenshot actual demo UI
        shell: pwsh
        run: |
          $p = Start-Process python -ArgumentList 'gaming/app.py --screenshot' -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'UI did not open' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path gaming-ui.png)) { throw 'Screenshot failed' }
      - name: Package app
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name JoyBridge-Gaming --paths experiments/android-motion --collect-all vgamepad --add-binary "vendor/SDL2-2.32.10/x86_64-w64-mingw32/bin/SDL2.dll;." gaming/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: JoyBridge-Gaming-portable
          path: |
            dist/JoyBridge-Gaming.exe
            gaming-ui.png
  installer:
    needs: windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: JoyBridge-Gaming-portable
          path: package
      - run: |
          sudo apt-get update
          sudo apt-get install -y nsis
          mkdir -p dist
          cp package/dist/JoyBridge-Gaming.exe dist/
          cp gaming/setup.nsi gaming-setup.nsi
          makensis -V2 gaming-setup.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: JoyBridge-Gaming-Setup
          path: JoyBridge-Gaming-Setup.exe
